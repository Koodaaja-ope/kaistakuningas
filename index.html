<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a22">
  <title>Kaistakuningas — ajopeli</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101a22;
      color: #f5f7f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(36, 82, 88, .3), transparent 55%),
        #101a22;
    }

    .game { width: min(100%, 980px); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #76d8bb;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 38px);
      letter-spacing: -.05em;
      line-height: 1;
    }

    .best {
      color: #afbec4;
      font-size: 13px;
      white-space: nowrap;
    }

    .best strong { color: #f7ce6a; font-variant-numeric: tabular-nums; }

    .screen {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(220, 244, 246, .15);
      border-radius: 18px;
      background: #17241f;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 960 / 600;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 14px 16px auto;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .stat {
      min-width: 90px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      background: rgba(13, 23, 24, .72);
      backdrop-filter: blur(8px);
    }

    .stat span {
      display: block;
      color: #afc0bd;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(8, 15, 17, .58);
      backdrop-filter: blur(5px);
    }

    .overlay[hidden] { display: none; }

    .panel {
      width: min(100%, 390px);
      padding: 30px;
      border: 1px solid rgba(236, 249, 246, .16);
      border-radius: 18px;
      background: rgba(18, 30, 32, .94);
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.3);
    }

    .panel .tag {
      color: #76d8bb;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .panel h2 {
      margin: 8px 0 10px;
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: -.05em;
      line-height: 1.05;
    }

    .panel p {
      margin: 0 auto 21px;
      color: #b7c5c6;
      font-size: 14px;
      line-height: 1.55;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .start {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      background: #76d8bb;
      color: #10251f;
      font-weight: 900;
      transition: transform .15s, background .15s;
    }

    .start:hover { transform: translateY(-1px); background: #91ebcf; }
    .start:focus-visible, .touch button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .hint {
      margin: 13px 0 0 !important;
      font-size: 11px !important;
      color: #91a2a3 !important;
    }

    .touch {
      display: none;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch button {
      width: 74px;
      height: 54px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 13px;
      background: #1b2b31;
      color: #f5f7f8;
      font-size: 22px;
      font-weight: 800;
      touch-action: none;
    }

    .touch button:active { background: #31514e; }

    @media (pointer: coarse) {
      .touch { display: flex; }
      body { padding: 16px; }
    }

    @media (max-width: 560px) {
      body { padding: 14px 10px; align-content: center; }
      header { align-items: center; }
      .best { font-size: 11px; }
      .hud { inset: 8px 8px auto; }
      .stat { min-width: 68px; padding: 6px 8px; }
      .stat strong { font-size: 16px; }
      .stat span { font-size: 8px; }
      .panel { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <p class="eyebrow">Pieni peli · suuret pisteet</p>
        <h1>Kaistakuningas</h1>
      </div>
      <div class="best">ENNÄTYS <strong id="best">0</strong></div>
    </header>

    <section class="screen" aria-label="Ajopeli">
      <canvas id="game" width="960" height="600" aria-label="Ylhäältä kuvattu ajopeli"></canvas>
      <div class="hud" aria-live="polite">
        <div class="stat"><span>Pisteet</span><strong id="score">0</strong></div>
        <div class="stat"><span>Nopeus</span><strong><span id="speed">0</span> <small style="font-size:11px">km/h</small></strong></div>
      </div>
      <div class="overlay" id="overlay">
        <div class="panel">
          <div class="tag">Valmiina lähtöön?</div>
          <h2 id="title">Väistä liikennettä.</h2>
          <p id="message">Pidä auto tiellä, väistä vastaantulijoita ja kerää mahdollisimman paljon pisteitä.</p>
          <button class="start" id="start">Aloita ajo</button>
          <p class="hint">Ohjaus: ← → tai A / D · Kiihdytä: ↑ / W · Jarruta: ↓ / S</p>
        </div>
      </div>
    </section>
    <nav class="touch" aria-label="Kosketusohjaimet">
      <button type="button" data-key="ArrowLeft" aria-label="Vasemmalle">←</button>
      <button type="button" data-key="ArrowDown" aria-label="Jarruta">↓</button>
      <button type="button" data-key="ArrowUp" aria-label="Kiihdytä">↑</button>
      <button type="button" data-key="ArrowRight" aria-label="Oikealle">→</button>
    </nav>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.querySelector("#score");
      const speedLabel = document.querySelector("#speed");
      const bestLabel = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const startButton = document.querySelector("#start");
      const W = canvas.width;
      const H = canvas.height;
      const road = { left: 245, right: 715 };
      const keys = new Set();
      const trafficColors = ["#f2b84b", "#e76f51", "#57a6a1", "#b7a0d4", "#e7e5df"];
      let state = "ready";
      let score = 0;
      let speed = 0;
      let roadOffset = 0;
      let spawnIn = 0;
      let lastTime = 0;
      let traffic = [];
      let scenery = [];
      const player = { x: W / 2, y: H - 132, w: 48, h: 84 };

      let best = 0;
      try { best = Number(localStorage.getItem("kaistakuningas-best")) || 0; } catch {}
      bestLabel.textContent = best.toLocaleString("fi-FI");

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawCar(x, y, w, h, color, isPlayer = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "rgba(0,0,0,.28)";
        roundedRect(-w / 2 + 3, -h / 2 + 5, w, h, 11);
        ctx.fill();

        ctx.fillStyle = "#182123";
        roundedRect(-w / 2 - 4, -h / 2 + 13, 8, 17, 3); ctx.fill();
        roundedRect(w / 2 - 4, -h / 2 + 13, 8, 17, 3); ctx.fill();
        roundedRect(-w / 2 - 4, h / 2 - 30, 8, 17, 3); ctx.fill();
        roundedRect(w / 2 - 4, h / 2 - 30, 8, 17, 3); ctx.fill();

        ctx.fillStyle = color;
        roundedRect(-w / 2, -h / 2, w, h, 10);
        ctx.fill();
        ctx.fillStyle = isPlayer ? "#c8f3e5" : "rgba(255,255,255,.34)";
        roundedRect(-w / 2 + 6, -h / 2 + 15, w - 12, 24, 6);
        ctx.fill();
        ctx.fillStyle = isPlayer ? "#315a58" : "rgba(23,39,42,.78)";
        roundedRect(-w / 2 + 7, h / 2 - 30, w - 14, 19, 5);
        ctx.fill();

        if (isPlayer) {
          ctx.fillStyle = "#fff2bc";
          roundedRect(-w / 2 + 4, -h / 2 + 3, 10, 5, 2); ctx.fill();
          roundedRect(w / 2 - 14, -h / 2 + 3, 10, 5, 2); ctx.fill();
          ctx.fillStyle = "#ed7164";
          roundedRect(-w / 2 + 4, h / 2 - 8, 10, 4, 2); ctx.fill();
          roundedRect(w / 2 - 14, h / 2 - 8, 10, 4, 2); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.75)";
          ctx.fillRect(-2, -h / 2 + 4, 4, h - 8);
        } else {
          ctx.fillStyle = "#fff0b5";
          roundedRect(-w / 2 + 5, h / 2 - 8, 9, 4, 2); ctx.fill();
          roundedRect(w / 2 - 14, h / 2 - 8, 9, 4, 2); ctx.fill();
        }
        ctx.restore();
      }

      function drawWorld(dt) {
        ctx.fillStyle = "#426b4c";
        ctx.fillRect(0, 0, W, H);

        const stripe = 72;
        const offset = (roadOffset * .55) % stripe;
        for (let y = -stripe + offset; y < H + stripe; y += stripe) {
          ctx.fillStyle = "#497654";
          ctx.fillRect(0, y, road.left - 19, 35);
          ctx.fillRect(road.right + 19, y, W - road.right - 19, 35);
          ctx.fillStyle = "#d6c9a8";
          ctx.fillRect(road.left - 16, y, 4, 32);
          ctx.fillRect(road.right + 12, y, 4, 32);
        }

        if (state === "playing") {
          for (const tree of scenery) tree.y += speed * dt * .55;
          scenery = scenery.filter(tree => tree.y < H + 40);
          while (scenery.length < 16) {
            const side = Math.random() < .5 ? -1 : 1;
            scenery.push({ x: side < 0 ? 50 + Math.random() * 155 : 755 + Math.random() * 155, y: -Math.random() * H, r: 10 + Math.random() * 11 });
          }
        }

        for (const tree of scenery) {
          ctx.fillStyle = "rgba(22,51,35,.25)";
          ctx.beginPath(); ctx.arc(tree.x + 3, tree.y + 5, tree.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#315d3d";
          ctx.beginPath(); ctx.arc(tree.x, tree.y, tree.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#58865a";
          ctx.beginPath(); ctx.arc(tree.x - 4, tree.y - 5, tree.r * .56, 0, Math.PI * 2); ctx.fill();
        }

        ctx.fillStyle = "#3e4547";
        ctx.fillRect(road.left, 0, road.right - road.left, H);
        ctx.fillStyle = "#eee4c9";
        ctx.fillRect(road.left, 0, 7, H);
        ctx.fillRect(road.right - 7, 0, 7, H);
        ctx.fillStyle = "#f3eee1";
        const dashOffset = roadOffset % 92;
        for (let y = -92 + dashOffset; y < H + 92; y += 92) {
          ctx.fillRect(W / 2 - 3, y, 6, 48);
        }

        ctx.fillStyle = "rgba(255,255,255,.055)";
        ctx.fillRect(road.left + 12, 0, 3, H);
        ctx.fillRect(road.right - 15, 0, 3, H);
      }

      function endGame() {
        state = "over";
        const finalScore = Math.floor(score);
        if (finalScore > best) {
          best = finalScore;
          bestLabel.textContent = best.toLocaleString("fi-FI");
          try { localStorage.setItem("kaistakuningas-best", String(best)); } catch {}
        }
        title.textContent = "Kolari!";
        message.textContent = `Ajoit ${finalScore.toLocaleString("fi-FI")} pistettä. Kokeile uudelleen ja ylitä ennätyksesi!`;
        startButton.textContent = "Aja uudelleen";
        overlay.hidden = false;
      }

      function startGame() {
        score = 0;
        speed = 260;
        roadOffset = 0;
        spawnIn = .65;
        traffic = [];
        scenery = [];
        player.x = W / 2;
        state = "playing";
        scoreLabel.textContent = "0";
        speedLabel.textContent = Math.round(speed / 4).toString();
        title.textContent = "Väistä liikennettä.";
        message.textContent = "Pidä auto tiellä, väistä vastaantulijoita ja kerää mahdollisimman paljon pisteitä.";
        startButton.textContent = "Aloita ajo";
        overlay.hidden = true;
      }

      function update(dt) {
        if (state !== "playing") return;
        const accelerating = keys.has("ArrowUp") || keys.has("w") || keys.has("W");
        const braking = keys.has("ArrowDown") || keys.has("s") || keys.has("S");
        const steerLeft = keys.has("ArrowLeft") || keys.has("a") || keys.has("A");
        const steerRight = keys.has("ArrowRight") || keys.has("d") || keys.has("D");
        speed += (accelerating ? 250 : -24) * dt;
        if (braking) speed -= 420 * dt;
        speed = Math.max(105, Math.min(650, speed));
        if (steerLeft) player.x -= 340 * dt;
        if (steerRight) player.x += 340 * dt;
        player.x = Math.max(road.left + player.w / 2 + 11, Math.min(road.right - player.w / 2 - 11, player.x));
        roadOffset += speed * dt;
        score += speed * dt * .035;
        scoreLabel.textContent = Math.floor(score).toLocaleString("fi-FI");
        speedLabel.textContent = Math.round(speed / 4).toString();

        spawnIn -= dt;
        if (spawnIn <= 0) {
          const lanes = [road.left + 79, W / 2, road.right - 79];
          const lane = lanes[Math.floor(Math.random() * lanes.length)];
          if (!traffic.some(car => Math.abs(car.x - lane) < 70 && car.y < 150)) {
            traffic.push({
              x: lane + (Math.random() - .5) * 18,
              y: -100,
              w: 45,
              h: 78,
              color: trafficColors[Math.floor(Math.random() * trafficColors.length)],
              factor: .53 + Math.random() * .24
            });
          }
          spawnIn = Math.max(.48, 1.18 - score / 1400) + Math.random() * .45;
        }

        for (const car of traffic) car.y += speed * dt * (1 - car.factor);
        traffic = traffic.filter(car => car.y < H + car.h);
        for (const car of traffic) {
          if (Math.abs(player.x - car.x) < (player.w + car.w) * .42 &&
              Math.abs(player.y - car.y) < (player.h + car.h) * .42) {
            endGame();
            break;
          }
        }
      }

      function render(dt) {
        drawWorld(dt);
        for (const car of traffic) drawCar(car.x, car.y, car.w, car.h, car.color);
        drawCar(player.x, player.y, player.w, player.h, "#39b99a", true);
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, .04);
        lastTime = time;
        update(dt);
        render(dt);
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) event.preventDefault();
        keys.add(event.key);
        if (event.key === " " && state !== "playing") startGame();
      });
      window.addEventListener("keyup", event => keys.delete(event.key));
      window.addEventListener("blur", () => keys.clear());
      startButton.addEventListener("click", startGame);
      document.querySelectorAll(".touch button").forEach(button => {
        const key = button.dataset.key;
        button.addEventListener("pointerdown", event => { event.preventDefault(); keys.add(key); });
        for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
          button.addEventListener(type, () => keys.delete(key));
        }
      });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
